# Release: on every vX.Y.Z tag, build one package per architecture, sign
# everything with the release key, and publish the GitHub release with the
# update manifest. See docs/design/actualizaciones.md.
name: Release

on:
  push:
    tags: ['v*']
  # A dry run: build, sign and verify exactly as for a tag, publish nothing.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (must match package.json)'
        required: true

permissions:
  contents: write

env:
  NODE_VERSION: '24'
  # The version under build: from the tag, or from the dry run's input.
  VERSION: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}

jobs:
  build:
    name: package (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Tag must match package.json
        run: |
          V=$(node -p "require('./package.json').version")
          [ "v$V" = "${VERSION}" ] || { echo "package.json says $V, building ${VERSION}"; exit 1; }
      - name: Build client
        run: cd client && npm ci --no-audit --no-fund && npm run build
      - name: Package
        run: bash scripts/package-release.sh "${VERSION#v}" dist-release
      - name: Client bundle on its own (what releases used to ship)
        if: matrix.arch == 'x64'
        run: tar -czf dist-release/client-dist.tar.gz -C client dist
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.arch }}
          path: dist-release/*
          if-no-files-found: error

  release:
    name: sign and publish
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
      - name: Sign packages and manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          [ -n "$RELEASE_SIGNING_KEY" ] || { echo "RELEASE_SIGNING_KEY secret is not set"; exit 1; }
          umask 077; printf '%s\n' "$RELEASE_SIGNING_KEY" > /tmp/release_key
          V="${VERSION#v}"
          bash scripts/sign-release.sh sign /tmp/release_key dist-release/muxterm-"$V"-linux-*.tar.gz
          # A tag with a hyphen (v1.2.0-beta.1) is a beta; anything else is stable.
          case "$V" in *-*) CH=beta;; *) CH=stable;; esac
          echo "CHANNEL=$CH" >> "$GITHUB_ENV"
          bash scripts/make-manifest.sh "$V" dist-release "$CH"
          bash scripts/sign-release.sh sign /tmp/release_key "dist-release/$CH.json"
          ( cd dist-release && sha256sum muxterm-*.tar.gz "$CH.json" > SHA256SUMS )
          # The branch installations poll: one signed manifest per channel.
          git fetch -q origin channels 2>/dev/null && git worktree add -q /tmp/channels origin/channels \
            || { git worktree add -q --detach /tmp/channels && ( cd /tmp/channels && git checkout -q --orphan channels && git rm -rfq . >/dev/null 2>&1 || true ); }
          cp "dist-release/$CH.json" "dist-release/$CH.json.sig" /tmp/channels/
          rm -f /tmp/release_key
      - name: Verify what we are about to publish
        run: bash scripts/sign-release.sh verify dist-release/muxterm-*.tar.gz "dist-release/$CHANNEL.json"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'push'
        with:
          name: release-dry-run
          path: dist-release/*
      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Create the release unless it exists (a re-run, or someone made it by hand), then
          # upload everything, replacing what is already there.
          gh release view "${VERSION}" >/dev/null 2>&1 \
            || gh release create "${VERSION}" --title "MuxTerm ${VERSION#v}" --generate-notes --latest
          gh release upload "${VERSION}" --clobber \
            dist-release/muxterm-*.tar.gz dist-release/muxterm-*.tar.gz.sig dist-release/muxterm-*.tar.gz.sha256 \
            "dist-release/$CHANNEL.json" "dist-release/$CHANNEL.json.sig" dist-release/SHA256SUMS dist-release/client-dist.tar.gz
      - name: Publish the channel manifest
        if: github.event_name == 'push'
        run: |
          cd /tmp/channels
          git -c user.name=muxterm-release -c user.email=release@muxterm add "$CHANNEL.json" "$CHANNEL.json.sig"
          git -c user.name=muxterm-release -c user.email=release@muxterm commit -q -m "$CHANNEL: ${VERSION}" || echo "manifest unchanged"
          git push -q origin HEAD:channels
